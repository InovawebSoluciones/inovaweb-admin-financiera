{% extends "base.html" %}
{% block title %}Login - Inovaweb CAF{% endblock %}
{% block layout %}
<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white shadow-md rounded-lg p-8">
    <h1 class="text-2xl font-bold text-slate-900 mb-1">Inovaweb CAF</h1>
    <p class="text-sm text-slate-500 mb-6">Centro de Administracion Financiera</p>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded p-3 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Email</label>
        <input type="email" name="email" required
               class="mt-1 w-full border-slate-300 rounded-md px-3 py-2 border">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Contrasena</label>
        <input type="password" name="password" required
               class="mt-1 w-full border-slate-300 rounded-md px-3 py-2 border">
      </div>
      <button type="submit"
              class="w-full bg-slate-900 text-white py-2 rounded-md hover:bg-slate-800">
        Entrar
      </button>
    </form>

    <p class="mt-6 text-xs text-slate-500 text-center">
      Sin cuenta? <a href="/signup-request" class="text-blue-600">Solicita acceso</a>
    </p>
  </div>
</div>
{% endblock %}
