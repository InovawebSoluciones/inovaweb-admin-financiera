{% extends "base.html" %}
{% block title %}Solicitar acceso - LiaForge{% endblock %}
{% block layout %}
<div class="min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md bg-white shadow-md rounded-lg p-8">
    <h1 class="text-2xl font-bold mb-4">Solicitar acceso</h1>
    <p class="text-sm text-slate-600 mb-6">
      Llena el formulario y un asesor de Inovaweb te contactara.
    </p>
    <form id="f" hx-post="/signup-request" hx-ext="json-enc"
          hx-headers='{"Content-Type":"application/json"}'
          class="space-y-3">
      <input name="legal_name" required placeholder="Razon social"
             class="w-full border rounded px-3 py-2">
      <input name="rfc" required placeholder="RFC"
             class="w-full border rounded px-3 py-2">
      <input name="contact_email" type="email" required placeholder="Email de contacto"
             class="w-full border rounded px-3 py-2">
      <input name="contact_phone" placeholder="Telefono"
             class="w-full border rounded px-3 py-2">
      <textarea name="notes" placeholder="Notas"
                class="w-full border rounded px-3 py-2"></textarea>
      <button type="submit"
              class="w-full bg-[#0B1020] text-white py-2 rounded">Enviar</button>
    </form>
    <div id="ok" class="mt-4 text-green-700 text-sm hidden">Solicitud recibida.</div>
  </div>
</div>
{% endblock %}
