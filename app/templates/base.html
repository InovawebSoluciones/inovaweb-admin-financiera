<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}LiaForge{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:'Inter',system-ui,sans-serif}h1,h2,h3,.font-display{font-family:'Space Grotesk','Inter',sans-serif}</style>
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234F46E5'/><path d='M18 41 L32 27 L46 41' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/><path d='M49 12 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2 z' fill='%23F59E0B'/></svg>"><text y='.9em' font-size='90'>%F0%9F%92%BC</text></svg>">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  {% block layout %}
  <div class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </div>
  {% endblock %}
</body>
</html>
